<!doctype html>
<html lang="en" class="bg-paper text-ink font-sans scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Dino Paškvan</title>
    <meta name="description" content="Notes on systems and software." />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="canonical" href="https://paskvan.eu/blog/" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Blog | Dino Paškvan" />
    <meta property="og:description" content="Notes on systems and software." />
    <meta property="og:url" content="https://paskvan.eu/blog/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Blog | Dino Paškvan" />
    <meta name="twitter:description" content="Notes on systems and software." />
    <link rel="alternate" type="application/rss+xml" title="Dino Paškvan's Blog" href="/feed.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />
    <script>
        (function () {
            var t = localStorage.getItem("theme");
            if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            if (t === "dark") document.documentElement.classList.add("dark");
        })();
    </script>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="flex flex-col min-h-screen">
    <header class="container mx-auto px-4 py-6 animate-slide-down-fade-in motion-reduce:animate-none">
        <nav class="flex items-center justify-between">
            <div class="flex items-center">
                <a href="/index.html" class="flex items-center">
                    <img src="/assets/logo.svg" alt="Logo" class="h-12 w-auto mr-4 dark:invert" />
                    <ul>
                        <li class="leading-tight font-display">
                            Dino <strong class="font-bold">Paškvan</strong><br />
                            <span class="text-sm text-muted font-mono font-normal">systems engineer &amp; developer</span>
                        </li>
                    </ul>
                </a>
            </div>
            <div class="flex items-center space-x-5">
                <a href="/blog/" class="font-mono text-sm text-muted hover:text-accent transition-colors duration-200">blog</a>
                <button id="theme-toggle" type="button" aria-label="Toggle dark mode"
                    class="inline-block opacity-60 hover:opacity-100 transition-opacity duration-200 cursor-pointer">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v8" />
                        <path d="M18.36 6.64a9 9 0 1 1-12.73 0" />
                    </svg>
                </button>
                <a href="https://www.linkedin.com/in/dpaskvan/" aria-label="LinkedIn Profile" target="_blank"
                    rel="noopener noreferrer"
                    class="inline-block opacity-60 hover:opacity-100 transition-opacity duration-200">
                    <img src="/assets/icons/linkedin.svg" class="h-5 w-5 align-middle" alt="LinkedIn" />
                </a>
                <a href="https://github.com/dpskvn" aria-label="View GitHub Profile" target="_blank"
                    rel="noopener noreferrer"
                    class="inline-block opacity-60 hover:opacity-100 transition-opacity duration-200">
                    <img src="/assets/icons/github.svg" class="h-5 w-5 align-middle dark:invert" alt="GitHub" />
                </a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-6 flex-grow animate-fade-in-main opacity-0 motion-reduce:animate-none motion-reduce:opacity-100">
        <section class="py-6">
            <p class="font-mono text-sm text-accent mb-2">// blog</p>
            <h2 class="font-display text-2xl font-semibold mb-8">Things I've written</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <p class="font-mono text-sm text-muted">// no posts yet</p>
            </div>
            <div class="mt-8">
                <a href="/index.html" class="font-mono text-sm text-accent hover:underline">&larr; back home</a>
            </div>
        </section>
    </main>

    <footer
        class="container mx-auto px-4 py-6 mt-0 border-t border-line text-center flex-shrink-0 animate-fade-in-footer opacity-0 motion-reduce:animate-none motion-reduce:opacity-100">
        <small class="font-mono text-muted">&copy; 2026 Dino Paškvan</small>
    </footer>
    <script src="/assets/site.js" defer></script>
</body>

</html>
